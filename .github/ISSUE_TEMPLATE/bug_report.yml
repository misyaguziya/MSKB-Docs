name: 不具合の報告
description: MSKB が思ったとおりに動かないとき
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        先に [FAQ](https://misyaguziya.github.io/MSKB-Docs/faq) で同じ症状がないか確認してください。
        ここは公開の場所です。ユーザー名やメールアドレスなど、個人の情報は書かないでください。
  - type: input
    id: version
    attributes:
      label: MSKB のバージョン
      description: PC の設定画面の左下に出ています。
      placeholder: v1.0.0
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 使っている VR 機器
      placeholder: 例：Valve Index、Quest 3（Virtual Desktop）
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 行った操作
      description: 起きるまでの操作を順に書いてください。
      placeholder: |
        1. キーボードを開く
        2. 日本語を選んで入力する
        3. ...
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 起きたことと、期待していたこと
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: エラーのログ（任意）
      description: |
        設定画面の「困ったとき」→「エラーのログ」の「コピー」で写したものを貼ってください。
        ユーザー名を含むファイルの場所が出ることがあるので、その部分は消してから貼ってください。
      render: text
