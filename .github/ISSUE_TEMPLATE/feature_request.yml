name: 要望
description: MSKB にほしい機能や、変えてほしいところ
labels: [enhancement]
body:
  - type: textarea
    id: want
    attributes:
      label: してほしいこと
      description: どんな場面で、何ができると助かるかを書いてください。
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MSKB のバージョン（任意）
      placeholder: v1.0.0
