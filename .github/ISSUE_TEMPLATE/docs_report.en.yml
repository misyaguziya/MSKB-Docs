name: Documentation error
description: A mistake or something unclear in the user guide (English)
labels: [documentation, "lang:en", needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        **This is a public place.** Don't include personal information such as your Windows user name, your Steam or VRChat name, full paths or your BOOTH order number.
        If you attach a screenshot, remove anything private that shows in it.
  - type: input
    id: page
    attributes:
      label: Page or section
      description: The URL of the page, or the name of the heading
      placeholder: https://misyaguziya.github.io/MSKB-Docs/en/faq
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong
      description: What is incorrect, what differs from the actual screen or behavior, or what is unclear
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix (optional)
  - type: input
    id: version
    attributes:
      label: MSKB version (optional)
      description: If it differs from the actual screen or behavior
      placeholder: v1.0.2
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed personal information, such as my Windows user name, my Steam or VRChat name, full paths and my BOOTH order number, from the text and the attachments.
          required: true
