name: Feature request
description: Something you'd like MSKB to do or change (English)
labels: [enhancement, "lang:en", needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        **This is a public place.** Don't include personal information such as your Windows user name, your Steam or VRChat name, full paths or your BOOTH order number.
  - type: textarea
    id: problem
    attributes:
      label: The problem and when it happens
      description: Before the feature you want, describe what is hard for you and in what situation.
    validations:
      required: true
  - type: textarea
    id: want
    attributes:
      label: What you'd like
      description: If you have an idea of how it should work. Leave it empty if you don't.
  - type: textarea
    id: workaround
    attributes:
      label: What you do now
      description: How you cope today, including any other input method or setting you use instead.
  - type: dropdown
    id: priority
    attributes:
      label: How much it matters to you (optional)
      options:
        - Nice to have
        - Inconvenient without it
        - Can't use MSKB without it
  - type: input
    id: version
    attributes:
      label: MSKB version (optional)
      placeholder: v1.0.2
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed personal information, such as my Windows user name, my Steam or VRChat name, full paths and my BOOTH order number, from the text.
          required: true
